# Required Parameter: node

- name: orchestrate {{ node.name }} - collect templates
  ansible.builtin.set_fact:
    node_template_tree: >-
      {{ query('community.general.filetree', 'templates/hadoop-common')
         + query('community.general.filetree', 'templates/' ~ node.group) }}

- name: orchestrate {{ node.name }} - clean
  ansible.builtin.file:
    path: "{{ node.name }}"
    state: absent

- name: orchestrate {{ node.name }} - mkdir
  ansible.builtin.file:
    path: "{{ node.name }}"
    state: directory

# One mkdir call instead of one task per directory, the directory layout
# carries no ansible semantics.
- name: orchestrate {{ node.name }} - mkdir template dirs
  ansible.builtin.command:
    argv: >-
      {{ ['mkdir', '-p']
         + (node_template_tree | selectattr('state', 'equalto', 'directory')
                               | map(attribute='path') | unique | list) }}
    chdir: "{{ node.name }}"

- name: orchestrate {{ node.name }} - template
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ node.name }}/{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: "a+x"
  loop: "{{ node_template_tree | selectattr('state', 'equalto', 'file') | list }}"
