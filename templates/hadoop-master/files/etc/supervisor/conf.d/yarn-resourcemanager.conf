[program:yarn-resourcemanager]
directory=/opt/hadoop
command=/opt/start-resourcemanager.sh
startsecs=30
stopwaitsecs=10
user=yarn
redirect_stderr=true
stdout_logfile=/var/log/yarn-resourcemanager.log
autostart=true

environment=
    JAVA_HOME=/opt/openjdk-17,
    HADOOP_LOG_DIR=/var/log/hadoop-yarn
