[program:mapred-history-server]
directory=/opt/hadoop
command=bash /opt/start-history-server.sh
startsecs=30
stopwaitsecs=10
user=mapred
redirect_stderr=true
stdout_logfile=/var/log/mapred-history-server.log
autostart=true

environment=
    JAVA_HOME=/opt/openjdk-17,
    HADOOP_LOG_DIR=/var/log/hadoop-mapred
